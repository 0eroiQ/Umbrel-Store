releaseNotes: >-
  v3.3.4 keeps confirmed zero-fill Testnet FOK expiry, cancellation, and rejection outcomes
  retryable instead of arming the persistent emergency stop. Partial, non-zero, unknown,
  unreconciled, and managed-exit balance-mismatch outcomes remain fail-closed. An emergency stop
  already stored by an earlier version must be resumed once after updating. Live-money execution
  remains deployment-locked.
