manifestVersion: 1.1
id: zeroq-polyagent
category: finance
name: CryptoAgent
version: '3.3.6'
tagline: Self-hosted Binance Testnet trading — 6 bots, scanner, risk controls
icon: https://raw.githubusercontent.com/ZeroQ-bit/Umbrel-Store/master/zeroq-polyagent/icon.png
description: >-
  CryptoAgent is a self-hosted Binance Spot trading system with six automatic strategy
  bots, scanner-ranked symbol selection, performance tracking, encrypted SQLCipher storage,
  and persistent risk controls.

  Paper mode simulates orders. Binance Spot Testnet mode uses exchange test funds and
  records exchange order references, fills, positions, and restart-recovery evidence.
  Live-market execution remains protected by a deployment-level interlock that is disabled
  in this Umbrel package and cannot be bypassed from the dashboard. No profitability claim
  forms part of this release.
