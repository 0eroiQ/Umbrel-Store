releaseNotes: >-
  v3.3.5 adds a live public Binance BTC reference beside the mode badge and displays it in the
  dashboard browser's regional currency, including AUD for Australian locales. Regional conversion
  uses cached ECB reference rates and falls back visibly to USD if FX is unavailable. The display
  is isolated from strategy, risk, accounting, and order execution. Testnet and live-money safety
  controls are unchanged, and live-money execution remains deployment-locked.
