releaseNotes: >-
  v3.6.1 adds an optional bridge to a Pionex Signal Bot, so trade intents can be executed on a
  Pionex account instead of only being simulated. It sends nothing unless a webhook address, a
  signal identifier, and an explicit arming switch are all set, so an unconfigured or partly
  configured install cannot place an order by accident. Until armed it records the exact message it
  would send, which is worth reviewing first because symbol formatting depends on the pair each bot
  is configured for. Both the webhook address and the signal identifier are stored encrypted, hidden
  in the interface, and never written to logs. Paper and Spot Testnet are unchanged, and no
  profitability claim forms part of this release. Existing settings and Testnet positions persist
  through the update.
