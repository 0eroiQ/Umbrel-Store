tagline: BTC 5-minute fixture-backed paper-trading preview
icon: https://raw.githubusercontent.com/ZeroQ-bit/Umbrel-Store/master/zeroq-polyagent/icon.png
description: >-
  PolyAgent Paper Preview is an early, self-hosted research build containing one
  fixture-backed BTC 5-minute lane. It replays bundled, versioned market fixtures,
  evaluates a deterministic reversal strategy, simulates fill-or-kill paper orders
  against recorded executable depth, and records decisions, fills, and emergency-stop
  state in an encrypted local database.


  This 0.1.0 preview does not connect to live market feeds and does not include wallet
  credentials, authenticated Polymarket order access, a live-order gateway, backtesting,
  or the eight-lane functionality described by the future PolyAgent v1 contract.
