  settlement, EIP-712 order signing, armed fail-closed gateway, eligibility probe) — see
  PR #8 on the source repo. All order-placement code is gateway-only and OFF by default.
  NOTE: the container image is still the verified 0.1.0 build (paper-only). A 1.1.0+ image
