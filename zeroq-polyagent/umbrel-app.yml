releaseNotes: >-
  v3.4.2 restores trading, which v3.4.0 had silently stopped. Orders are checked at a limit price
  that crosses the spread slightly, so a trade sized at exactly the configured per-order ceiling
  came out fractionally above it and was refused every time — the agent produced trade signals for
  hours without placing a single order. Trade size now sits below the ceiling, and entries refused
  before an order is created are counted and reported instead of passing silently. This release
  also publishes under the renamed container registry owner; the previous one could not be fetched
  at all. It carries forward v3.4.0's order-book protections: the agent refuses to trade on a
  crossed book, and each symbol's book is rebuilt from the exchange every 30 seconds. Paper and
  Spot Testnet remain available; real-money execution is still not included, and no profitability
  claim forms part of this release. Existing settings and Testnet positions persist through the
  update.
