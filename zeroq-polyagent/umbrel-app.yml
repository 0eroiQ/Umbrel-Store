releaseNotes: >-
  v3.3.7 removes Testnet-only symbols such as COSUSDT from scanner and execution candidates by
  requiring production Spot TRADING eligibility. Completed-trade performance now survives restarts.
  The normal app rejects and purges live credentials, refuses production Binance order endpoints,
  and removes its direct live-order path. Paper and Spot Testnet remain available; real-money
  execution is not included. Existing settings and Testnet positions persist through the update.
