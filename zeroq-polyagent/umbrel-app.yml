releaseNotes: >-
  v3.3.6 makes the live BTC reference currency timezone-aware. Umbrel browsers that report a generic
  US locale now use the device's local IANA timezone, so Australia/Perth and other Australia zones
  display the converted BTC price in AUD. Locale fallback and visible USD fallback remain available.
  The display is isolated from strategy, risk, accounting, and order execution. Testnet and
  live-money safety controls are unchanged, and live-money execution remains deployment-locked.
