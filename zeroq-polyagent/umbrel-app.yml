releaseNotes: >-
  v3.3.9 rounds limit prices to the symbol tick in the direction that keeps them marketable: up
  for buys, down for sells. Prices were previously always rounded down, which moved a buy away
  from the best ask and could erase a price cushion narrower than one tick, causing the order to
  expire unfilled. This follows v3.3.8, which fixed the underlying order-book defect behind almost
  every Testnet buy expiring: the Binance depth stream sends only changed levels, and updates were
  applied without checking their sequence numbers against the snapshot, so a stale level could sit
  below the real best ask indefinitely. Depth updates are now sequence-checked and re-synced
  whenever a gap appears, and trading mode is validated wherever it is resolved, so live mode is
  refused from every source. Paper and Spot Testnet remain available; real-money execution is
  still not included, and no profitability claim forms part of this release. Existing settings and
  Testnet positions persist through the update.
