releaseNotes: >-
  v3.3.2 adds tabbed settings for Trading, Testnet Risk Controls, Spot Testnet, and Live
  Account. Testnet Risk Controls persist order value, daily-loss stop, stop-loss, loss-streak
  cooldown, drawdown and per-symbol exposure limits, trade-speed limit, and excluded symbols.
  The Testnet canary remains capped at one position, $10 per order, and $5 daily loss. Live-money
  execution remains deployment-locked.
