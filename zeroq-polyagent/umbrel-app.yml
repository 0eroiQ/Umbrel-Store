releaseNotes: >-
  v3.4.1 fixes trade sizing that stopped the agent placing any order at all. Orders are checked
  at a limit price that crosses the spread slightly, so a trade sized at exactly the configured
  per-order ceiling came out fractionally above it and was refused every time. Trade size now sits
  below the ceiling. Entries refused before an order is created are also counted and reported: that
  path previously recorded nothing, so a setting that blocked every trade was indistinguishable
  from a quiet market. This follows v3.4.0, which stopped the agent trading on a crossed order book
  and rebuilt each symbol's book from the exchange every 30 seconds. Paper and Spot Testnet remain
  available; real-money execution is still not included, and no profitability claim forms part of
  this release. Existing settings and Testnet positions persist through the update.
