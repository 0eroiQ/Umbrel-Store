tagline: Self-hosted Binance paper and Testnet trading with strict live isolation
icon: https://raw.githubusercontent.com/ZeroQ-bit/Umbrel-Store/master/zeroq-polyagent/icon.png
description: >-
  CryptoAgent is a self-hosted Binance Spot trading system with six automatic strategy
  bots, scanner-ranked symbol selection, performance tracking, encrypted SQLCipher storage,
  and persistent risk controls.

  Paper mode simulates orders. Binance Spot Testnet mode uses exchange test funds and
  records exchange order references, fills, positions, and restart-recovery evidence. Scanner
  and execution candidates must also be active on production Binance Spot, and completed-trade
  performance survives restarts.

  The normal app is technically Testnet-only: it rejects live credentials, production Binance
  order endpoints, and live mode from every source, including the stored setting. Real-money
  execution is not included in this Umbrel package. No profitability claim forms part of this
  release.
