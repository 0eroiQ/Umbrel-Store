releaseNotes: >-
  v3.5.0 stops the agent trading when a move cannot pay for itself. Buying and selling both cross
  the spread, so every completed trade paid that spread whether or not the signal was right: over
  39 measured round trips the result was 8 wins, 22 losses and a small net loss, on an average
  captured move far below what the round trip cost. Entries now require the recent price range to
  exceed the spread plus trading fees by a configurable multiple, and fees are assumed at the
  normal exchange rate even though Spot Testnet charges none, so behaviour reflects a real market.
  Exits are never blocked, so an open position can always be closed. Expect noticeably fewer
  trades: in quiet conditions the agent may decline to trade at all, which is the intended
  outcome. Refused entries are reported with the range and cost that caused them, so the threshold
  can be tuned. Paper and Spot Testnet remain available; real-money execution is still not
  included, and no profitability claim forms part of this release. Existing settings and Testnet
  positions persist through the update.
