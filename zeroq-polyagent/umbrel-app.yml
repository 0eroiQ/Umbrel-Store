tagline: Self-hosted Polymarket monitoring & paper trading
icon: https://raw.githubusercontent.com/ZeroQ-bit/Umbrel-Store/master/zeroq-polyagent/icon.png
description: >-
  PolyAgent is a self-hosted, encrypted-at-rest platform that monitors real-time
  prediction-market order books, evaluates a deterministic reversal strategy, and
  simulates paper trading at executable depth.

  This v1.0.0 release delivers the paper vertical slice on a complete foundation: a
  BTC 5-minute lane running end-to-end (fixture-backed by default), with encrypted
  SQLCipher storage, global risk controls including a persisted emergency-stop, and full
  decision/fill provenance.

  Live read-only Polymarket market-data adapters (Gamma/CLOB/WSS) are implemented and
  fail-closed behind operator eligibility — they can be enabled to stream real books and
  trades. The codebase also now includes a complete fail-closed live-order gateway
  (EIP-712 order signing, two-step arming, hard-risk ceilings, eligibility probe) — but it
  is OFF by default and incapable of placing orders unless explicitly armed with real
  credentials by an eligible operator. Default paper mode is technically incapable of order
  submission. No profitability claim forms part of acceptance.
