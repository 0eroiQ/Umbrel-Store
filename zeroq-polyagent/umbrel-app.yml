tagline: Self-hosted Polymarket monitoring & paper trading
icon: https://raw.githubusercontent.com/ZeroQ-bit/Umbrel-Store/master/zeroq-polyagent/icon.png
description: >-
  PolyAgent is a self-hosted, encrypted-at-rest platform that monitors real-time
  prediction-market order books, evaluates a deterministic reversal strategy, and
  simulates paper trading at executable depth. This v1.0.0 release delivers the paper
  vertical slice: one end-to-end BTC 5-minute lane running on a complete foundation.

  It replays bundled, versioned, hash-verified market fixtures; reconciles order books
  (snapshots, deltas, sequence gaps); applies global risk controls with a persisted
  emergency-stop requiring deliberate re-arm; and records every decision and paper fill
  with full provenance (version + hash + human-readable reason trace) in an encrypted
  SQLCipher database.

  Default paper mode is technically incapable of authenticated order submission. The
  optional isolated live-order gateway is off by default and fail-closed. No
  profitability claim forms part of acceptance.
