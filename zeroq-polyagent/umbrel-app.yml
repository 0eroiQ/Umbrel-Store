releaseNotes: >-
  v3.4.3 fixes the per-coin exposure limit, which was refusing every buy. That limit is an amount
  in USDT rather than a percentage, and it had been left far below a single trade, so the risk
  guardian rejected each entry before an order was created. It now sits at the same level as the
  per-order limit, and existing installs are migrated. Entry refusals that happen before an order
  exists are also reported on the status endpoint now: they previously left no trace anywhere,
  which is why a setting that blocked all trading looked identical to a quiet market. Carries
  forward v3.4.2's registry fix and v3.4.0's order-book protections. Paper and Spot Testnet remain
  available; real-money execution is still not included, and no profitability claim forms part of
  this release. Existing settings and Testnet positions persist through the update.
