releaseNotes: >-
  v3.3.3 automatically returns the Risk Guardian to SAFE when a timed losing-streak cooldown
  expires, resets the completed loss streak, and heals an already-expired warning after restart.
  The dashboard now shows the automatic resume time. Emergency stops, daily-loss stops, and
  drawdown circuit breakers remain fail-closed; live-money execution remains deployment-locked.
