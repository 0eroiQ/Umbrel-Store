releaseNotes: >-
  v3.4.0 stops the agent trading on a bad order book and raises Spot Testnet trade sizes. If the
  local book is ever crossed — a stale price sitting on the wrong side of the market — strategies
  now decline to trade instead of pricing orders against a level that no longer exists. Each
  symbol's book is also rebuilt from the exchange every 30 seconds, so no stale price can persist,
  and failures fetching it are recorded rather than ignored. Testnet trade sizing now matches the
  10,000 USDT of exchange test funds the Testnet account is issued: 500 USDT per order, up to five
  concurrent positions, and a 250 USDT daily loss limit, replacing the previous single-position
  10 USDT canary. Limits are still enforced, only raised. Real-money execution remains impossible
  in this package, and no profitability claim forms part of this release. Existing settings and
  Testnet positions persist through the update.
