releaseNotes: >-
  v3.3.8 fixes an order-book defect that caused almost every Testnet buy to expire unfilled. The
  Binance depth stream sends only changed levels, and the app was applying those updates without
  checking their sequence numbers against the snapshot it started from. A removal that arrived
  during that gap was never applied, so a stale level could sit below the real best ask
  indefinitely and orders priced from it could not fill. Depth updates are now sequence-checked
  and re-synced whenever a gap appears. Trading mode is also validated wherever it is resolved,
  including the stored setting, so live mode is refused from every source. Paper and Spot Testnet
  remain available; real-money execution is still not included, and no profitability claim forms
  part of this release. Existing settings and Testnet positions persist through the update.
