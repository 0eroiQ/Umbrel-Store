releaseNotes: >-
  v3.5.3 fixes the root cause of the order-book corruption that earlier releases had only masked.
  Binance marks a price level for removal by sending it with zero size, encoded as "0.00000000",
  but the app compared against the exact text "0" and so never removed the level — it left it in
  the book at its old price, where it could sit at the top and make the book look crossed. On the
  live box this had the book unusable roughly half the time; the fix takes that to zero. Removals
  are now recognised by numeric value, so every zero encoding clears the level. Paper and Spot
  Testnet remain available; real-money execution is still not included, and no profitability claim
  forms part of this release. Existing settings and Testnet positions persist through the update.
