releaseNotes: >-
  v3.5.1 makes the app report anything that stops it trading. An upstream exchange outage recently
  left it idle for seven hours while appearing perfectly healthy, with nothing written to its logs,
  which was indistinguishable from a quiet market. It now reports an unusable order book and why,
  a failing book refresh, entries refused before an order is created, and any period longer than
  two minutes without a trading decision. This follows v3.5.0, which stops the app trading when a
  price move cannot cover the spread and fees it would pay. Paper and Spot Testnet remain
  available; real-money execution is still not included, and no profitability claim forms part of
  this release. Existing settings and Testnet positions persist through the update.
