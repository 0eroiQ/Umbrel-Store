version: '3.7'

services:
  app_proxy:
    environment:
      APP_HOST: zeroq-polyagent_server_1
      APP_PORT: 8080
      PROXY_AUTH_ADD: 'true'

  server:
    # Immutable multi-architecture 3.4.0 image. The normal server is Testnet-only in code.
    image: ghcr.io/0eroiq/polyagent:3.4.0@sha256:85cc39c854f9a937eeb83b61537d3a96b9a1df15e5c38e4f939f41d2581259fd
    restart: on-failure
    stop_grace_period: 30s
    user: '1001:1001'
    environment:
      NODE_ENV: production
      POLYAGENT_DB_PATH: /app/data/polyagent.db
      POLYAGENT_SETUP_MARKER: /app/data/setup-complete
      POLYAGENT_FIXTURES_DIR: /app/fixtures/market-data
      POLYAGENT_WEB_DIST: /app/web
      # First-run default only. Once the app has been configured, the mode stored in the encrypted
      # database takes precedence over this value, so a running instance may report 'testnet' while
      # this still reads 'paper' — check /ready for the effective mode. Both are validated
      # fail-closed; 'live' is rejected from either source.
      POLYAGENT_MODE: paper
      POLYAGENT_ALLOWED_ORIGINS: '*'
      POLYAGENT_DB_KEY_FILE: /run/secrets/db_key
      POLYAGENT_BOOTSTRAP_TOKEN_FILE: /run/secrets/bootstrap_token
      POLYAGENT_SESSION_SECRET_FILE: /run/secrets/session_secret
    volumes:
      - ${APP_DATA_DIR}/data:/app/data
      - ${APP_DATA_DIR}/secrets/db_key:/run/secrets/db_key:ro
      - ${APP_DATA_DIR}/secrets/bootstrap_token:/run/secrets/bootstrap_token:ro
      - ${APP_DATA_DIR}/secrets/session_secret:/run/secrets/session_secret:ro
    networks:
      default:
        aliases:
          - zeroq-polyagent-server
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
