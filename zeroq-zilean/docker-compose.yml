services:
  app_proxy:
    environment:
      APP_HOST: zeroq-zilean_server_1
      APP_PORT: 8181
      PROXY_AUTH_ADD: "false"

  server:
    image: ipromknight/zilean:latest
    restart: on-failure
    stop_grace_period: 30s
    tty: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TZ: Etc/UTC
      Zilean__Database__ConnectionString: "Host=zeroq-zilean-postgres;Port=5432;Database=zilean;Username=postgres;Password=postgres"
      # Batched import: designed for low-RAM systems (the box has ~8GB total).
      # Trades ingestion speed for lower peak memory usage.
      Zilean__Dmm__ImportBatched: "true"
    volumes:
      - ${APP_DATA_DIR}/data/zilean:/app/data

  postgres:
    image: postgres:16.3-alpine3.20
    restart: on-failure
    stop_grace_period: 30s
    environment:
      TZ: Etc/UTC
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: zilean
    volumes:
      - ${APP_DATA_DIR}/data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s
