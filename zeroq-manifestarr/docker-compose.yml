version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: zeroq-manifestarr_api_1
      APP_PORT: 8787
      PROXY_AUTH_ADD: "true"

  api:
    image: ghcr.io/zeroq-bit/manifestarr:0.1.11@sha256:4b25eece2c1e4277d13477b26f6e79ff212daa87b728e2e552e10aaefde67b8e
    restart: on-failure
    stop_grace_period: 30s
    command:
      - uv
      - run
      - --no-dev
      - manifestarr
      - serve
      - --host
      - 0.0.0.0
      - --database
      - /data/manifestarr.sqlite3
      - --allow-private-networks
    environment:
      TZ: Etc/UTC
      MANIFESTARR_BUNDLED_PLEX_URL: http://host.docker.internal:32400
      MANIFESTARR_BUNDLED_PLEX_CLAIM_SOCKET: /run/manifestarr/plex-claim.sock
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ${APP_DATA_DIR}/data/manifestarr:/data
      - ${APP_DATA_DIR}/data/plex/claim:/run/manifestarr
    depends_on:
      claim_agent:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          /app/.venv/bin/python -c "import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8787/health', timeout=5).read()"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

  claim_agent:
    image: ghcr.io/zeroq-bit/manifestarr:0.1.11@sha256:4b25eece2c1e4277d13477b26f6e79ff212daa87b728e2e552e10aaefde67b8e
    restart: on-failure
    stop_grace_period: 30s
    network_mode: host
    command:
      - uv
      - run
      - --no-dev
      - manifestarr
      - claim-agent
      - --socket
      - /run/manifestarr/plex-claim.sock
    environment:
      TZ: Etc/UTC
    volumes:
      - ${APP_DATA_DIR}/data/plex/claim:/run/manifestarr
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          /app/.venv/bin/python -c "import httpx;
          client = httpx.Client(transport=httpx.HTTPTransport(
          uds='/run/manifestarr/plex-claim.sock'));
          client.get('http://manifestarr.local/health', timeout=5).raise_for_status()"
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 15s

  mount:
    image: ghcr.io/zeroq-bit/manifestarr:0.1.11@sha256:4b25eece2c1e4277d13477b26f6e79ff212daa87b728e2e552e10aaefde67b8e
    restart: on-failure
    stop_grace_period: 1m
    command:
      - uv
      - run
      - --no-dev
      - --extra
      - fuse
      - manifestarr
      - mount
      - /media
      - --database
      - /data/manifestarr.sqlite3
      - --allow-private-networks
      - --allow-other
      - --refresh-interval
      - "5"
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/fuse:/dev/fuse
    security_opt:
      - apparmor:unconfined
    volumes:
      - ${APP_DATA_DIR}/data/manifestarr:/data
      - ${UMBREL_ROOT}/home/Downloads/manifestarr:/media:rshared
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "mountpoint -q /media || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 15s

  plex:
    image: linuxserver/plex:1.43.3.10828-00f62d37d-ls315@sha256:59c671e182563040092a2d0901e429dc15e0aba9883acd13ef97857372b79b21
    restart: on-failure
    stop_grace_period: 1m
    hostname: Manifestarr
    network_mode: host
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Etc/UTC
      VERSION: docker
    volumes:
      - ${APP_DATA_DIR}/data/plex/config:/config
      - ${APP_DATA_DIR}/data/plex/transcode:/transcode
      - ${UMBREL_ROOT}/home/Downloads/manifestarr:/downloads/manifestarr:rslave,ro
    depends_on:
      mount:
        condition: service_healthy
