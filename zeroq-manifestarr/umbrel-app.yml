category: media
name: Manifestarr
version: "0.1.0"
tagline: A Plex-ready virtual library resolved from Stremio add-ons
icon: https://raw.githubusercontent.com/ZeroQ-bit/Umbrel-Store/master/zeroq-manifestarr/icon.png
description: >-
  Manifestarr turns Plex Watchlist and MDBList requests into a Plex-compatible
  virtual library. It resolves playable HTTP streams through configured
  Stremio-compatible add-ons only when needed and exposes stable, seekable
  library files without downloading complete media files.


  This Umbrel package includes Manifestarr, its read-only FUSE mount, and a
  dedicated Plex Media Server named Manifestarr. You do not need the stock
  Umbrel Plex app.


  SET-UP INSTRUCTIONS


  1. Install Manifestarr and open it from the Umbrel home screen.
  2. Claim the bundled Plex server once at http://umbrel.local:32400/web.
  3. In Manifestarr Settings, connect your Plex account and select the
  Manifestarr server.
  4. Connect your Stremio-compatible stream add-ons.
  5. Create the Plex movie and TV libraries using
  /downloads/manifestarr/movies and /downloads/manifestarr/shows.
  6. Add titles through Plex Watchlist or MDBList. Automatic sources resolve
  one movie at a time and retry provider rate limits later.


  The Plex service uses host port 32400 for normal Plex client discovery. Stop
  or uninstall any other Plex server on this Umbrel before installing
  Manifestarr. Series episode expansion remains planned for a later release.
