version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: zeroq-riven_frontend_1
      APP_PORT: 3000
      PROXY_AUTH_ADD: "false"

  server:
    image: ghcr.io/zeroq-bit/riven:sha-cf447d4@sha256:d43a8f2f2562492788690a58c93c39936e55361551bacb1d490eb7265beda901
    restart: on-failure
    stop_grace_period: 1m
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    shm_size: 1024m
    devices:
      - /dev/fuse
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Etc/UTC
      API_KEY: "0123456789abcdef0123456789abcdef"
      RIVEN_API_KEY: "0123456789abcdef0123456789abcdef"
      RIVEN_FORCE_ENV: "true"
      RIVEN_DATABASE_HOST: postgresql+psycopg2://postgres:postgres@zeroq-riven-postgres/riven
      RIVEN_FILESYSTEM_MOUNT_PATH: "/mount"
      RIVEN_LIBRARY_PATH: "/mount"
      RIVEN_UPDATERS_LIBRARY_PATH: "/downloads/riven"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/openapi.json >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
    volumes:
      - ${APP_DATA_DIR}/data/riven:/riven/data
      - ${UMBREL_ROOT}/data/storage/downloads/riven:/mount:rshared
    depends_on:
      zeroq-riven-postgres:
        condition: service_healthy

  webdav:
    image: rclone/rclone:1.69.3@sha256:1f497a86a6466395e62a5886613a14b7b18809543566ef9fa35fa1371a7ecc0f
    restart: on-failure
    stop_grace_period: 1m
    user: "1000:1000"
    command:
      - serve
      - webdav
      - /mount
      - "-L"
      - --addr
      - :8081
      - --read-only
      - --user
      - riven
      - --pass
      - riven
      - --log-level
      - INFO
    ports:
      - "8081:8081"
    volumes:
      - ${UMBREL_ROOT}/data/storage/downloads/riven:/mount:rslave,ro
    depends_on:
      server:
        condition: service_healthy

  ftp:
    image: rclone/rclone:1.69.3@sha256:1f497a86a6466395e62a5886613a14b7b18809543566ef9fa35fa1371a7ecc0f
    restart: on-failure
    stop_grace_period: 1m
    user: "1000:1000"
    command:
      - serve
      - ftp
      - /mount
      - "-L"
      - --addr
      - :2121
      - --read-only
      - --user
      - riven
      - --pass
      - riven
      - --passive-port
      - 30000-30010
      - --public-ip=${APP_ZEROQ_RIVEN_LOCAL_IPV4:-127.0.0.1}
      - --log-level
      - INFO
    ports:
      - "2121:2121"
      - "30000-30010:30000-30010"
    volumes:
      - ${UMBREL_ROOT}/data/storage/downloads/riven:/mount:rslave,ro
    depends_on:
      server:
        condition: service_healthy

  frontend:
    image: ghcr.io/zeroq-bit/riven-frontend:sha-85c441d@sha256:5b235715e63b01376b376882236a44d071e9225d88fe6b588315cb99cade36c7
    restart: on-failure
    stop_grace_period: 1m
    user: "1000:1000"
    environment:
      TZ: Etc/UTC
      BACKEND_URL: "http://zeroq-riven_server_1:8080"
      BACKEND_API_KEY: "0123456789abcdef0123456789abcdef"
      DATABASE_URL: "/riven/data/riven.db"
      AUTH_SECRET: "${APP_SEED}"
      DISABLE_EMAIL_PASSWORD: "false"
      ENABLE_EMAIL_PASSWORD_SIGNUP: "true"
      # Do NOT set ORIGIN: SvelteKit ignores HOST_HEADER/PROTOCOL_HEADER when it is set,
      # and better-auth uses ORIGIN as its only trusted origin. A hardcoded LAN-IP ORIGIN
      # breaks login/register from umbrel.local, Tailscale, or any other hostname.
      HOST_HEADER: "host"
      PROTOCOL_HEADER: "x-forwarded-proto"
    volumes:
      - ${APP_DATA_DIR}/data/frontend:/riven/data
    depends_on:
      server:
        condition: service_healthy

  zeroq-riven-postgres:
    image: postgres:17-alpine@sha256:778d0b486d6daa02b77434d0358ec57a1b21fd8b6d22ac2eef56a33e816928f6
    restart: on-failure
    stop_grace_period: 1m
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: riven
    volumes:
      - ${APP_DATA_DIR}/data/postgres:/var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d riven"]
      interval: 10s
      timeout: 5s
      retries: 5
