port: 7000
description: >-
  A self-hosted instance of the Torrentio scraper (the Knightcrawler backend by
  sleeyax/torrentio-scraper-sh) that finds torrents and exposes them as a
  Stremio-compatible addon. Riven can scrape this instance to feed your debrid
  provider (e.g. Premiumize) with cached torrent infohashes.


  This is the independent, rate-limit-free alternative to shared Comet
  instances: it scrapes torrent sources directly and stores results in its own
  Postgres/MongoDB/RabbitMQ stack, so large libraries won't choke a shared
  host.


  The scrapers are curated for networks where some torrent sites are
  ISP-blocked: eztv and the DebridMediaManager GitHub hash lists are enabled;
  TPB/YTS/TorrentGalaxy are disabled (re-enable them in the producer config if
  your network allows them).


  SET-UP INSTRUCTIONS


  1. Install Torrentio and wait for the initial scrape to populate (this takes
  a few hours on first run; the addon serves partial results as they arrive).

  2. The addon manifest is at http://<umbrel-ip>:7000/manifest.json.

  3. In Riven, go to Settings -> Scraping -> Comet and set the URL to
  http://zeroq-torrentio-addon:7000/<config>/manifest.json (or the bare addon
  URL if Riven scrapes it directly). Ask for the exact URL if unsure.

  4. Optional: add a GitHub Personal Access Token to the producer env
  (GithubSettings__PAT) to raise rate limits when ingesting DMM hash lists.


  Data (Postgres, MongoDB, RabbitMQ) is persisted under the app data directory.
