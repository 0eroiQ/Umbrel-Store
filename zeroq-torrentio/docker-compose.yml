version: "3.8"

services:
  app_proxy:
    environment:
      APP_HOST: zeroq-torrentio_addon_1
      APP_PORT: 7000
      PROXY_AUTH_ADD: "false"

  postgres:
    image: postgres:16-alpine
    restart: on-failure
    stop_grace_period: 30s
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: knightcrawler
      PGUSER: postgres
    volumes:
      - ${APP_DATA_DIR}/data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s

  mongodb:
    image: mongo:7
    restart: on-failure
    stop_grace_period: 30s
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongo
      MONGO_INITDB_ROOT_PASSWORD: mongo
    volumes:
      - ${APP_DATA_DIR}/data/mongo:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok' | grep -q 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s

  rabbitmq:
    image: rabbitmq:3-management
    restart: on-failure
    stop_grace_period: 30s
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - ${APP_DATA_DIR}/data/rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s

  producer:
    image: ghcr.io/zeroq-bit/knightcrawler-producer:sha-fd6c114@sha256:0bad87167141122ac0c13b457e7ab9e50418f915efadf906579d071923b7d988
    restart: on-failure
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      TZ: Etc/UTC
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: knightcrawler
      MONGODB_HOST: mongodb
      MONGODB_PORT: "27017"
      MONGODB_DB: knightcrawler
      MONGO_INITDB_ROOT_USERNAME: mongo
      MONGO_INITDB_ROOT_PASSWORD: mongo
      RabbitMqConfiguration__Host: rabbitmq
      RabbitMqConfiguration__QueueName: ingested
      RabbitMqConfiguration__Username: guest
      RabbitMqConfiguration__Password: guest
      RabbitMqConfiguration__Durable: "true"
      RabbitMqConfiguration__MaxQueueSize: "0"
      RabbitMqConfiguration__MaxPublishBatchSize: "500"
      RabbitMqConfiguration__PublishIntervalInSeconds: "10"
      # Optional: raise DMM ingestion rate limits by adding a GitHub PAT here.
      GithubSettings__PAT: "${TORRENTIO_GITHUB_PAT:-}"

  consumer:
    image: ghcr.io/zeroq-bit/knightcrawler-consumer:sha-967c903@sha256:0c9704c219c8c1da64153060e79930487784ebda6ef031e66d3d0fd14f573ab8
    restart: on-failure
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      TZ: Etc/UTC
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: knightcrawler
      MONGODB_HOST: mongodb
      MONGODB_PORT: "27017"
      MONGODB_DB: knightcrawler
      MONGO_INITDB_ROOT_USERNAME: mongo
      MONGO_INITDB_ROOT_PASSWORD: mongo
      RABBIT_URI: amqp://guest:guest@rabbitmq:5672/?heartbeat=30
      QUEUE_NAME: ingested
      # Raised from the default 5: the consumer resolves IMDb metadata per
      # torrent (slow external lookups), so a single container at concurrency 5
      # can't keep up with DMM ingestion (16k+ torrents). The box has 8 cores /
      # 5GB free, so 20 parallel jobs materially speeds up the initial scrape.
      JOB_CONCURRENCY: "20"
      JOBS_ENABLED: "true"
      MAX_SINGLE_TORRENT_CONNECTIONS: "10"
      TORRENT_TIMEOUT: "30000"
      UDP_TRACKERS_ENABLED: "true"

  addon:
    image: ghcr.io/zeroq-bit/knightcrawler-addon:sha-848a4bd@sha256:d8462ea502b540b59c8fe210ec3d6a3b72894af1ca1bc15be9daa050311fd534
    restart: on-failure
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      TZ: Etc/UTC
      DEBUG_MODE: "false"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      # The addon (Node/Sequelize) reads POSTGRES_DATABASE / POSTGRES_USERNAME,
      # NOT POSTGRES_DB / POSTGRES_USER (those are the producer/consumer names).
      # Without these it defaults the DB to "selfhostio" (which doesn't exist).
      POSTGRES_DATABASE: knightcrawler
      POSTGRES_USERNAME: postgres
      POSTGRES_PASSWORD: postgres
      MONGODB_HOST: mongodb
      MONGODB_PORT: "27017"
      MONGODB_DB: knightcrawler
      # Must match the consumer's collection (its default is
      # knightcrawler_consumer_collection; the addon defaults to
      # selfhostio_consumer_collection without this).
      MONGODB_COLLECTION: knightcrawler_consumer_collection
      MONGO_INITDB_ROOT_USERNAME: mongo
      MONGO_INITDB_ROOT_PASSWORD: mongo
    networks:
      default:
        aliases:
          - zeroq-torrentio-addon
