releaseNotes: >-
  Adds AllDebrid as a third debrid provider alongside TorBox and Real-Debrid.
  AllDebrid uses its native WebDAV endpoint (webdav.debrid.it) with rclone —
  no zurg required. The bundled plex_debrid engine already supports AllDebrid
  natively, so this release wires up the settings model, mount configuration,
  and UI dropdown. TorBox-specific link repair now skips silently for non-TorBox
  providers.
