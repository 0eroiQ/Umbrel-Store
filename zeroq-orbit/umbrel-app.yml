releaseNotes: >-
  Completes delayed Premiumize and WebDAV media handoffs automatically, retries
  reserved movie and series folders when their mounted source appears, and
  keeps targeted Plex scans pending until the recovered media is visible in
  Plex's catalog. Empty, Movies-only, and Series-only libraries remain fully
  supported.
