releaseNotes: >-
  Prevents a mislabeled TorBox result from being linked under the wrong Plex
  title.


  Before creating any library link, Vortexo now verifies the requested movie
  or show title against the actual TorBox torrent and selected video filename.
  Conflicting release years are also rejected.


  A mismatch fails safely before mount lookup, symlink creation, or Plex
  scanning. The job keeps a clear failure reason and Watchlist automation can
  retry later when a genuine cached release becomes available.
submitter: ZeroQ
submission: https://github.com/ZeroQ-bit/Umbrel-Store/pull/2
